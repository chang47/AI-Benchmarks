<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cannae, 216 BC — a rule-based re-enactment</title>
<style>
  :root { --ink: #fff8ec; --dim: rgba(255, 248, 236, .66); --panel: rgba(28, 22, 18, .72); --line: rgba(255, 240, 215, .16);
    --rome: #e0533f; --carth: #3d8fd1; --gold: #f2c14e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #a9c7de; color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; background: var(--panel); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 14px; }
  #story { left: 16px; top: 16px; max-width: min(430px, calc(100vw - 32px)); padding: 14px 16px; }
  #story h1 { margin: 0; font: 700 22px/1.1 Georgia, "Times New Roman", serif; letter-spacing: .02em; }
  #story .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  #caption { margin-top: 10px; font: 16px/1.4 Georgia, serif; min-height: 44px; }
  #clock { margin-top: 8px; color: var(--gold); font-variant-numeric: tabular-nums; font-size: 12px; letter-spacing: .06em; }
  #tally { right: 16px; top: 16px; padding: 12px 14px; width: 230px; }
  #tally .row { display: flex; justify-content: space-between; align-items: baseline; }
  #tally .n { font: 700 20px/1 Georgia, serif; font-variant-numeric: tabular-nums; }
  #tally .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); margin: 4px 0 10px; overflow: hidden; }
  #tally .bar i { display: block; height: 100%; width: 0; }
  #tally small { color: var(--dim); }
  #legend { right: 16px; top: 172px; padding: 10px 12px; width: 230px; font-size: 12px; }
  #legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid rgba(0,0,0,.3); }
  #bar { left: 16px; right: 16px; bottom: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 9px; padding: 7px 11px; cursor: pointer; }
  button:hover, button:focus-visible { background: rgba(255,255,255,.2); outline: none; }
  button[aria-pressed="true"] { background: var(--gold); color: #2a1c0e; border-color: var(--gold); }
  #play { width: 44px; font-size: 16px; }
  #track { position: relative; flex: 1; height: 34px; cursor: pointer; }
  #track .rail { position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); }
  #track .fill { position: absolute; left: 0; top: 15px; height: 4px; border-radius: 2px; background: var(--gold); width: 0; }
  #track .ahead { position: absolute; left: 0; top: 15px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); width: 0; }
  #track .mark { position: absolute; top: 9px; width: 3px; height: 16px; margin-left: -1px; border-radius: 2px; background: #fff; opacity: .75; }
  #track .knob { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px rgba(0,0,0,.25); }
  #track input { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }
  .group { display: flex; gap: 6px; }
  #cams { left: 16px; bottom: 76px; padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100vw - 32px); }
  .label { position: fixed; transform: translate(-50%, -100%); pointer-events: none; font: 600 11px/1.2 system-ui, sans-serif; color: #fff;
    background: rgba(20, 16, 12, .62); padding: 2px 6px; border-radius: 6px; white-space: nowrap; border-left: 3px solid var(--c, #fff); }
  @media (max-width: 760px) {
    #legend { display: none; }
    #tally { top: auto; bottom: 128px; width: 170px; padding: 8px 10px; }
    #tally .n { font-size: 16px; }
    #story { max-width: calc(100vw - 32px); padding: 10px 12px; }
    #story h1 { font-size: 18px; }
    #caption { font-size: 14px; min-height: 0; }
    #bar { flex-wrap: wrap; gap: 8px; }
    #track { order: 3; flex-basis: 100%; }
    #cams { bottom: 128px; max-width: calc(100vw - 220px); }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="3D re-enactment of the Battle of Cannae"></canvas>
<section id="story" class="panel" aria-live="polite">
  <h1>Cannae, 2 August 216 BC</h1>
  <div class="sub">Hannibal vs. Rome · a rule-based re-enactment — every soldier follows the same rules</div>
  <div id="caption"></div>
  <div id="clock"></div>
</section>
<section id="tally" class="panel" aria-label="Casualties">
  <div class="row"><span>Rome</span><span class="n" id="deadR">0</span></div>
  <div class="bar"><i id="barR" style="background: var(--rome)"></i></div>
  <div class="row"><span>Carthage</span><span class="n" id="deadC">0</span></div>
  <div class="bar"><i id="barC" style="background: var(--carth)"></i></div>
  <small>fallen · of <span id="menR"></span> Romans and <span id="menC"></span> Carthaginians</small>
</section>
<section id="legend" class="panel" aria-label="Legend"></section>
<nav id="cams" class="panel" aria-label="Camera views"></nav>
<section id="bar" class="panel" aria-label="Playback">
  <button id="play" aria-label="Play">▶</button>
  <div id="track"><div class="rail"></div><div class="ahead"></div><div class="fill"></div><div class="knob"></div>
    <input id="scrub" type="range" min="0" max="3000" step="1" value="0" aria-label="Battle time"></div>
  <div class="group" id="speeds" role="group" aria-label="Playback speed"></div>
  <button id="labels" aria-pressed="true">Labels</button>
</section>
<script src="vendor/three-r186.iife.js"></script>
<script src="sim.js"></script>
<script src="battle.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
